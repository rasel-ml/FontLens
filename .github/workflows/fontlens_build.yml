name: Build FontLens APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew
        
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > app/fontlens-release-key.jks
    
      - name: Create keystore properties
        run: |
          echo "storeFile=fontlens-release-key.jks" > keystore.properties
          echo "storePassword=${{ secrets.KEYPASS }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEY }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEYPASS }}" >> keystore.properties
          
      # - name: Build debug APK
        # run: ./gradlew assembleDebug --stacktrace
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
        
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: FontLens
          path: '**/*.apk'
          archive: false
          retention-days: 30