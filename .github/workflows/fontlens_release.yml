name: Release FontLens APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        default: 'v1.0.0-alpha.1'

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest successful build run
        id: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh run list -R ${{ github.repository }} \
            --workflow "Build FontLens APK" --branch main \
            --status success --limit 1 \
            --json databaseId -q '.[0].databaseId')
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Download APK artifact
        uses: actions/download-artifact@v5
        with:
          name: FontLens
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: FontLens ${{ inputs.tag }}
          files: '**/*.apk'
          generate_release_notes: true